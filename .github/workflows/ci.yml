name: Verify fork

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, verify/r8-acceptance-20260922]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Check repository contracts
        run: |
          python3 scripts/verify_repository.py
          python3 scripts/verify_upgrade_sql.py
          git diff --check
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6.3.0
      - name: Compile application and device tests first
        run: |
          set -o pipefail
          ./gradlew --no-daemon clean :app:assembleDebug :app:assembleDebugAndroidTest 2>&1 | tee "$RUNNER_TEMP/compile-build.log"
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: compilation-reports
          path: |
            ${{ runner.temp }}/compile-build.log
            app/schemas
          if-no-files-found: ignore
      - name: Build and test both variants
        run: |
          set -o pipefail
          ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleRelease 2>&1 | tee "$RUNNER_TEMP/build.log"
      - name: Lint
        if: ${{ !cancelled() }}
        run: ./gradlew --no-daemon :app:lintDebug
      - name: Verify generated schema is committed
        run: |
          git diff --exit-code -- app/schemas
          test -z "$(git ls-files --others --exclude-standard app/schemas)"
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: verification-reports
          path: |
            app/build/reports
            app/build/test-results
            app/schemas
            ${{ runner.temp }}/build.log
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: debug-device-tests
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/androidTest/debug/*.apk

  device-tests:
    name: device-api-${{ matrix.api }}-${{ matrix.variant }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api: [26, 35]
        variant: [debug, verification]
        include:
          - variant: debug
            task: connectedDebugAndroidTest
            filter: ''
          - variant: verification
            task: connectedVerificationAndroidTest
            filter: '-Pandroid.testInstrumentationRunnerArguments.class=me.kafuuneko.rpclient.feature.MinifiedRuntimeSmokeTest,me.kafuuneko.rpclient.libs.backup.BackupRepositoryRoundTripTest,me.kafuuneko.rpclient.libs.chat.ChatArchiveRepositoryTest,me.kafuuneko.rpclient.libs.room.AppDatabaseMigrationTest'

    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6.3.0
      - name: Enable runner KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          disable-animations: true
          script: bash -o pipefail -c './gradlew --no-daemon -PtestBuildType=${{ matrix.variant }} :app:${{ matrix.task }} ${{ matrix.filter }} 2>&1 | tee "$RUNNER_TEMP/device-build.log"'
      - name: Report device test counts
        if: ${{ !cancelled() }}
        run: |
          python3 - <<'PYTEST'
          from collections import Counter
          from pathlib import Path
          import os
          import xml.etree.ElementTree as ET

          reports = list(Path("app/build/outputs/androidTest-results/connected").rglob("TEST-*.xml"))
          totals = {key: 0 for key in ("tests", "failures", "errors", "skipped")}
          failures = Counter()
          for report in reports:
              suite = ET.parse(report).getroot()
              for key in totals:
                  totals[key] += int(suite.get(key, 0))
              for case in suite.iter("testcase"):
                  for failure in case:
                      if failure.tag in ("failure", "error"):
                          cause = (failure.text or failure.get("message") or "").strip().splitlines()
                          failures[(case.get("classname", "unknown").rsplit(".", 1)[-1],
                                    cause[0][:160] if cause else failure.tag)] += 1
          lines = [f"Device test report: {totals}; XML files: {len(reports)}"]
          lines.extend(f"{name}: {cause} ({count})" for (name, cause), count in sorted(failures.items()))
          print("\n".join(lines))
          print(f"::notice title=Device test counts::tests={totals['tests']} "
                f"failures={totals['failures']} errors={totals['errors']} skipped={totals['skipped']}")
          for (name, cause), count in sorted(failures.items()):
              safe_cause = cause.replace("%", "%25").replace("\r", " ").replace("\n", " ")
              print(f"::error title=Device test {name}::{safe_cause} ({count} failures)")
          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              with open(summary, "a", encoding="utf-8") as output:
                  output.write("## Device test counts\n\n" + "\n".join(lines) + "\n")
          if not reports or not totals["tests"]:
              raise SystemExit("No Android device tests ran")
          if totals["failures"] or totals["errors"]:
              raise SystemExit("Android device tests reported failures")
          PYTEST
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: device-reports-api-${{ matrix.api }}-${{ matrix.variant }}
          path: |
            app/build/reports/androidTests
            app/build/outputs/androidTest-results
            ${{ runner.temp }}/device-build.log
          if-no-files-found: ignore
