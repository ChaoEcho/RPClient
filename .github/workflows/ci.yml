name: Verify fork

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'integrate/**', 'fix/**', 'refactor/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Check repository contracts
        run: |
          python3 scripts/verify_repository.py
          git diff --check
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test both variants
        run: ./gradlew --no-daemon clean :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleRelease :app:assembleDebugAndroidTest
      - name: Verify generated schema is committed
        run: git diff --exit-code -- app/schemas
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-reports
          path: |
            app/build/reports
            app/build/test-results
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: debug-device-tests
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/androidTest/debug/*.apk
