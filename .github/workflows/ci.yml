name: Verify fork

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'integrate/**', 'fix/**', 'refactor/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Check repository contracts
        run: |
          python3 scripts/verify_repository.py
          git diff --check
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6.3.0
      - name: Build and test both variants
        run: |
          set -o pipefail
          ./gradlew --no-daemon clean :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease :app:assembleDebugAndroidTest 2>&1 | tee "$RUNNER_TEMP/build.log"
      - name: Lint
        if: ${{ !cancelled() }}
        run: ./gradlew --no-daemon :app:lintDebug
      - name: Verify generated schema is committed
        run: git diff --exit-code -- app/schemas
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: verification-reports
          path: |
            app/build/reports
            app/build/test-results
            app/schemas
            ${{ runner.temp }}/build.log
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: debug-device-tests
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/androidTest/debug/*.apk

  device-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api: [26, 35]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6.3.0
      - name: Enable runner KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          disable-animations: true
          script: ./gradlew --no-daemon :app:connectedDebugAndroidTest
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: device-reports-api-${{ matrix.api }}
          path: |
            app/build/reports/androidTests
            app/build/outputs/androidTest-results
          if-no-files-found: ignore
